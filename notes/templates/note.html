<!DOCTYPE html>
<html>
<head>
    <title>View Note</title>
</head>
<body>

    <p><strong>Logged in as:</strong> {{ request.user.username }}</p>

    <hr>

    <h1>{{ note.title }}</h1>

    <p>
        <strong>Owner:</strong> {{ note.owner.username }}
    </p>

</body>
</html>
